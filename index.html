<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>出入境记录（iPhone 简化版）</title>
  <style>
    :root {
      --bg: #f2f4f7;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --danger: #dc2626;
      --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    h1, h2, h3, p { margin: 0; }
    .title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .sub {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }
    .stat .k {
      font-size: 13px;
      color: var(--muted);
    }
    .stat .v {
      margin-top: 8px;
      font-size: 30px;
      font-weight: 800;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      margin-bottom: 16px;
      background: white;
    }
    .tab {
      border: none;
      background: transparent;
      padding: 14px 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
    }
    .tab.active {
      background: var(--primary);
      color: white;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .section-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      padding: 14px 14px;
      font-size: 17px;
      background: white;
      color: var(--text);
      appearance: none;
      -webkit-appearance: none;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px 16px;
      font-size: 17px;
      font-weight: 800;
      background: var(--primary);
      color: white;
    }
    .btn.secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn.danger {
      background: white;
      color: var(--danger);
      border: 1px solid #fecaca;
    }
    .helper {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-top: 8px;
    }
    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
    }
    .banner {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .country-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      background: white;
    }
    .record {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      background: white;
    }
    .record-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
      background: #eef2ff;
      color: #3730a3;
    }
    .record-text {
      font-size: 14px;
      line-height: 1.7;
      color: #374151;
    }
    .record-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .small-btn {
      flex: 1;
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: white;
      font-size: 14px;
      font-weight: 700;
    }
    .small-btn.delete {
      color: var(--danger);
      border-color: #fecaca;
    }
    .hidden { display: none !important; }
    .img-preview {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-top: 10px;
      background: white;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 26px 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">出入境记录</h1>
    <p class="sub">这是 iPhone 简化版：不带地图，不带外部脚本，尽量保证本地打开也能稳定运行。</p>

    <div class="stats">
      <div class="stat"><div class="k">总记录数</div><div class="v" id="statTotal">0</div></div>
      <div class="stat"><div class="k">去过国家/地区数</div><div class="v" id="statCountries">0</div></div>
    </div>

    <div class="card">
      <div class="banner">世界很大，您已经去过 <span id="visitedCountText">0</span> 个国家/地区啦。</div>
      <div id="countryChips" class="country-list"></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="addPanel">快速新增</button>
      <button class="tab" data-tab="historyPanel">历史记录</button>
    </div>

    <div id="addPanel" class="panel active">
      <div class="card">
        <div class="section-title">新增一条出入境记录</div>

        <div class="field">
          <label for="direction">类型</label>
          <select id="direction">
            <option value="entry">入境</option>
            <option value="exit">出境</option>
          </select>
        </div>

        <div class="row">
          <div class="field">
            <label for="date">日期</label>
            <input id="date" type="date" />
          </div>
          <div class="field">
            <label for="hour">时间（24 小时制，仅小时）</label>
            <select id="hour">
              <option value="00">00:00</option><option value="01">01:00</option><option value="02">02:00</option><option value="03">03:00</option>
              <option value="04">04:00</option><option value="05">05:00</option><option value="06">06:00</option><option value="07">07:00</option>
              <option value="08">08:00</option><option value="09">09:00</option><option value="10">10:00</option><option value="11">11:00</option>
              <option value="12">12:00</option><option value="13">13:00</option><option value="14">14:00</option><option value="15">15:00</option>
              <option value="16">16:00</option><option value="17">17:00</option><option value="18">18:00</option><option value="19">19:00</option>
              <option value="20">20:00</option><option value="21">21:00</option><option value="22">22:00</option><option value="23">23:00</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="country">国家/地区</label>
          <select id="country">
            <option value="">请选择</option>
            <option value="CN">China / 中国大陆</option>
            <option value="HK">Hong Kong SAR / 香港</option>
            <option value="MO">Macau SAR / 澳门</option>
            <option value="TW">Taiwan / 台湾</option>
            <option value="JP">Japan / 日本</option>
            <option value="KR">South Korea / 韩国</option>
            <option value="SG">Singapore / 新加坡</option>
            <option value="MY">Malaysia / 马来西亚</option>
            <option value="TH">Thailand / 泰国</option>
            <option value="VN">Vietnam / 越南</option>
            <option value="US">United States / 美国</option>
            <option value="CA">Canada / 加拿大</option>
            <option value="GB">United Kingdom / 英国</option>
            <option value="FR">France / 法国</option>
            <option value="DE">Germany / 德国</option>
            <option value="IT">Italy / 意大利</option>
            <option value="ES">Spain / 西班牙</option>
            <option value="AU">Australia / 澳大利亚</option>
            <option value="NZ">New Zealand / 新西兰</option>
            <option value="AE">United Arab Emirates / 阿联酋</option>
          </select>
        </div>

        <div class="field">
          <label for="city">城市</label>
          <input id="city" type="text" placeholder="如 Los Angeles / Tokyo / Hong Kong" />
        </div>

        <div class="field">
          <label for="port">口岸 / 机场 / 关口</label>
          <input id="port" type="text" placeholder="如 LAX / NRT / 深圳湾" />
        </div>

        <div class="field">
          <label for="transport">交通方式</label>
          <select id="transport">
            <option value="航空">航空</option>
            <option value="水路">水路</option>
            <option value="铁路">铁路</option>
            <option value="陆路">陆路</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="field">
          <label for="flightNo">航班 / 车次</label>
          <input id="flightNo" type="text" placeholder="如 CX880" />
        </div>

        <div class="field hidden" id="visaPolicyField">
          <label for="visaPolicy">签证政策</label>
          <select id="visaPolicy">
            <option value="免签证">免签证</option>
            <option value="落地签">落地签</option>
            <option value="电子签">电子签</option>
            <option value="纸签">纸签</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="field hidden" id="visaImageField">
          <label for="visaImage">签证页图片</label>
          <input id="visaImage" type="file" accept="image/*" />
          <img id="visaPreview" class="img-preview hidden" alt="visa preview" />
          <button class="btn secondary hidden" id="clearVisaBtn" type="button" style="margin-top:10px;">移除签证页</button>
        </div>

        <div class="field">
          <label for="stampImage">入境章 / 出境章图片（可选）</label>
          <input id="stampImage" type="file" accept="image/*" />
          <img id="stampPreview" class="img-preview hidden" alt="stamp preview" />
          <button class="btn secondary hidden" id="clearStampBtn" type="button" style="margin-top:10px;">移除图片</button>
        </div>

        <div class="field">
          <label for="note">备注</label>
          <textarea id="note" placeholder="如：旅游 / 回港 / 返美 / 过关排队较久"></textarea>
        </div>

        <button class="btn" id="saveBtn">保存记录</button>
        <div id="saveStatus" class="status"></div>
      </div>
    </div>

    <div id="historyPanel" class="panel">
      <div class="card">
        <div class="section-title">历史记录</div>
        <div class="row" style="margin-bottom:14px;">
          <button class="btn secondary" id="exportBtn">导出 JSON</button>
          <button class="btn danger" id="clearAllBtn">清空全部</button>
        </div>
        <div class="field">
          <label for="importFile">导入 JSON</label>
          <input id="importFile" type="file" accept="application/json" />
        </div>
        <div id="historyList"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'iphone-entry-exit-simple-v1';
    const COUNTRY_LABELS = {
      CN: 'China / 中国大陆', HK: 'Hong Kong SAR / 香港', MO: 'Macau SAR / 澳门', TW: 'Taiwan / 台湾',
      JP: 'Japan / 日本', KR: 'South Korea / 韩国', SG: 'Singapore / 新加坡', MY: 'Malaysia / 马来西亚',
      TH: 'Thailand / 泰国', VN: 'Vietnam / 越南', US: 'United States / 美国', CA: 'Canada / 加拿大',
      GB: 'United Kingdom / 英国', FR: 'France / 法国', DE: 'Germany / 德国', IT: 'Italy / 意大利',
      ES: 'Spain / 西班牙', AU: 'Australia / 澳大利亚', NZ: 'New Zealand / 新西兰', AE: 'United Arab Emirates / 阿联酋'
    };

    let records = [];

    const $ = (id) => document.getElementById(id);

    function loadRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        records = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(records)) records = [];
      } catch {
        records = [];
      }
    }

    function saveRecordsToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function isEntry() {
      return $('direction').value === 'entry';
    }

    function needsVisaInfo() {
      return isEntry() && $('country').value && $('country').value !== 'CN';
    }

    function needsVisaImage() {
      return ['落地签', '电子签', '纸签'].includes($('visaPolicy').value);
    }

    function updateVisaUI() {
      const showVisa = needsVisaInfo();
      $('visaPolicyField').classList.toggle('hidden', !showVisa);
      $('visaImageField').classList.toggle('hidden', !(showVisa && needsVisaImage()));
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function formatDateTime(rec) {
      return `${rec.date} ${rec.hour}:00`;
    }

    function renderStats() {
      $('statTotal').textContent = records.length;
      const countries = [...new Set(records.map(r => r.country).filter(Boolean))];
      $('statCountries').textContent = countries.length;
      $('visitedCountText').textContent = countries.length;
      $('countryChips').innerHTML = countries.length
        ? countries.map(c => `<span class="chip">${COUNTRY_LABELS[c] || c}</span>`).join('')
        : '<div class="empty">还没有国家/地区记录</div>';
    }

    function renderHistory() {
      const list = $('historyList');
      const sorted = [...records].sort((a, b) => `${b.date} ${b.hour}`.localeCompare(`${a.date} ${a.hour}`));
      if (!sorted.length) {
        list.innerHTML = '<div class="empty">还没有记录</div>';
        return;
      }
      list.innerHTML = sorted.map((r, idx) => `
        <div class="record">
          <div class="record-top">
            <span class="badge">${r.direction === 'entry' ? '入境' : '出境'}</span>
            <span style="font-size:13px;color:#6b7280;">${formatDateTime(r)}</span>
          </div>
          <div class="record-text">
            国家/地区：${COUNTRY_LABELS[r.country] || '-'}<br>
            城市：${r.city || '-'}<br>
            口岸：${r.port || '-'}<br>
            交通方式：${r.transport || '-'}<br>
            航班/车次：${r.flightNo || '-'}<br>
            签证政策：${r.visaPolicy || '-'}<br>
            备注：${r.note || '-'}
          </div>
          <div class="record-actions">
            <button class="small-btn" onclick="viewImage(${idx}, 'stamp')">看签章</button>
            <button class="small-btn" onclick="viewImage(${idx}, 'visa')">看签证页</button>
            <button class="small-btn delete" onclick="deleteRecord(${idx})">删除</button>
          </div>
        </div>
      `).join('');
    }

    function renderAll() {
      renderStats();
      renderHistory();
      updateVisaUI();
    }

    function resetForm() {
      $('direction').value = 'entry';
      $('date').value = new Date().toISOString().slice(0, 10);
      $('hour').value = String(new Date().getHours()).padStart(2, '0');
      $('country').value = '';
      $('city').value = '';
      $('port').value = '';
      $('transport').value = '航空';
      $('flightNo').value = '';
      $('visaPolicy').value = '免签证';
      $('note').value = '';
      $('stampImage').value = '';
      $('visaImage').value = '';
      $('stampPreview').src = '';
      $('visaPreview').src = '';
      $('stampPreview').classList.add('hidden');
      $('visaPreview').classList.add('hidden');
      $('clearStampBtn').classList.add('hidden');
      $('clearVisaBtn').classList.add('hidden');
      $('saveStatus').textContent = '';
      updateVisaUI();
    }

    async function saveRecord() {
      try {
        $('saveStatus').textContent = '保存中…';
        const record = {
          direction: $('direction').value,
          date: $('date').value,
          hour: $('hour').value,
          country: $('country').value,
          city: $('city').value.trim(),
          port: $('port').value.trim(),
          transport: $('transport').value,
          flightNo: $('flightNo').value.trim(),
          visaPolicy: '',
          visaImage: '',
          stampImage: '',
          note: $('note').value.trim()
        };

        if (!record.date || !record.hour || !record.country) {
          throw new Error('请至少填写日期、时间和国家/地区。');
        }

        const stampFile = $('stampImage').files[0];
        if (stampFile) record.stampImage = await fileToDataURL(stampFile);

        if (needsVisaInfo()) {
          record.visaPolicy = $('visaPolicy').value;
          const visaFile = $('visaImage').files[0];
          if (needsVisaImage()) {
            if (!visaFile) throw new Error('当前签证政策需要上传签证页图片。');
            record.visaImage = await fileToDataURL(visaFile);
          }
        }

        records.unshift(record);
        saveRecordsToStorage();
        renderAll();
        resetForm();
        $('saveStatus').textContent = '已保存。';
      } catch (e) {
        $('saveStatus').textContent = e.message || '保存失败。';
      }
    }

    function deleteRecord(idx) {
      const sorted = [...records].sort((a, b) => `${b.date} ${b.hour}`.localeCompare(`${a.date} ${a.hour}`));
      const target = sorted[idx];
      if (!target) return;
      const realIndex = records.indexOf(target);
      if (realIndex === -1) return;
      if (!confirm('确定删除这条记录吗？')) return;
      records.splice(realIndex, 1);
      saveRecordsToStorage();
      renderAll();
    }

    function viewImage(idx, type) {
      const sorted = [...records].sort((a, b) => `${b.date} ${b.hour}`.localeCompare(`${a.date} ${a.hour}`));
      const target = sorted[idx];
      if (!target) return;
      const url = type === 'stamp' ? target.stampImage : target.visaImage;
      if (!url) {
        alert(type === 'stamp' ? '这条记录没有签章图片。' : '这条记录没有签证页图片。');
        return;
      }
      const win = window.open();
      if (win) {
        win.document.write(`<img src="${url}" style="max-width:100%;height:auto;display:block;margin:0 auto;" />`);
      }
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'entry_exit_records_simple.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJson(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data)) throw new Error();
          records = data;
          saveRecordsToStorage();
          renderAll();
          alert('导入成功。');
        } catch {
          alert('导入失败。请确认是本页面导出的 JSON。');
        }
      };
      reader.readAsText(file);
    }

    function clearAll() {
      if (!confirm('确定清空全部记录吗？')) return;
      records = [];
      saveRecordsToStorage();
      renderAll();
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        $(btn.dataset.tab).classList.add('active');
      });
    });

    $('direction').addEventListener('change', updateVisaUI);
    $('country').addEventListener('change', updateVisaUI);
    $('visaPolicy').addEventListener('change', updateVisaUI);
    $('saveBtn').addEventListener('click', saveRecord);
    $('exportBtn').addEventListener('click', exportJson);
    $('clearAllBtn').addEventListener('click', clearAll);
    $('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) importJson(file);
      e.target.value = '';
    });

    $('stampImage').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      $('stampPreview').src = URL.createObjectURL(file);
      $('stampPreview').classList.remove('hidden');
      $('clearStampBtn').classList.remove('hidden');
    });

    $('visaImage').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      $('visaPreview').src = URL.createObjectURL(file);
      $('visaPreview').classList.remove('hidden');
      $('clearVisaBtn').classList.remove('hidden');
    });

    $('clearStampBtn').addEventListener('click', () => {
      $('stampImage').value = '';
      $('stampPreview').src = '';
      $('stampPreview').classList.add('hidden');
      $('clearStampBtn').classList.add('hidden');
    });

    $('clearVisaBtn').addEventListener('click', () => {
      $('visaImage').value = '';
      $('visaPreview').src = '';
      $('visaPreview').classList.add('hidden');
      $('clearVisaBtn').classList.add('hidden');
    });

    loadRecords();
    resetForm();
    renderAll();

    window.deleteRecord = deleteRecord;
    window.viewImage = viewImage;
  </script>
</body>
</html>
